name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract embedded JSX from index.html
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const m = html.match(/<script type="text\/babel"[^>]*>([\s\S]*?)<\/script>/);
            if (!m) { console.error("No text/babel script found in index.html"); process.exit(1); }
            fs.writeFileSync("app.jsx", m[1]);
            console.log("Extracted", m[1].length, "chars of JSX");
          '

      - name: Syntax-check embedded JSX
        run: npx --yes esbuild app.jsx --outfile=/dev/null

      - name: Syntax-check source component
        run: npx --yes esbuild src/planning-workbench.jsx --outfile=/dev/null

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
