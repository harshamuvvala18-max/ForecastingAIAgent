name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -f index.html
          ! grep -q "api.anthropic.com" index.html
          grep -q "PlanningWorkbench" index.html
